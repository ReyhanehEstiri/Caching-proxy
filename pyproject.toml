[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "caching-proxy"
version = "0.1.0"
description = "A simple HTTP caching proxy built with Python"
requires-python = ">=3.10"


[project.scripts]
caching-proxy = "caching_proxy.cli:main"


[tool.setuptools.packages.find]
where = ["."]